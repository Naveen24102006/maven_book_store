# Setup H2 in-memory configuration
spring.datasource.url=jdbc:h2:mem:bookstoredb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically update the database schema based on the Book entity
spring.jpa.hibernate.ddl-auto=update

# Enable H2 console console for debugging (accessible at /h2-console)

